[project]
name = "toxitrace-backend"
version = "0.1.0"
description = "ToxiTrace API: grounded ToxIndex predictions with provenance"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "anthropic>=0.40",
    "pandas>=3.0.6",
    "openpyxl>=3.1.5",
    "rdata>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
